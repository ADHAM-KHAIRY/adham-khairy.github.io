        /* 9. Ghost Shell - Ethereal gray/blue theme */
        :root {
            --bg-primary: #13151a;
            --bg-secondary: rgba(19, 21, 26, 0.8);
            --text-primary: #c9cadf;
            --text-secondary: #7a7c89;
            --accent: #6bd1ff;
            --border: #272a33;
            --header: #1d202a;
        }



        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            max-width: 800px;
            width: 90%;
        }

        .typing-text {
            font-size: 4rem;
            font-weight: bold;
            height: 6rem;
            margin-bottom: 2rem;
            color: var(--accent);
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: var(--accent);
            animation: blink 1s infinite;
            margin-left: 5px;
            height: 4rem;
            position: relative;
            top: 10px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--text-secondary);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .nav-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 1.2rem;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background-color: var(--header);
            border-color: var(--accent);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .social-icon {
            color: var(--text-secondary);
            font-size: 1.5rem;
            transition: color 0.3s ease;
            text-decoration: none;
        }

        .social-icon:hover {
            color: var(--accent);
        }

        .badge-container {
            margin-top: 40px;
            display: inline-block;
            border: 0px solid var(--border);
            border-radius: 6px;
            background-color: var(--bg-secondary);
        }

        .badge-container iframe {
            display: block;
            width: 328.5px;
            height: 87.5px;
            border: none;
        }

        .terminal-header {
            background-color: var(--header);
            color: var(--text-primary);
            padding: 8px 12px;
            font-weight: bold;
            text-align: left;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const textElement = document.querySelector('.typing-text');
            const messages = ['Hello World.', 'Hello Friend...'];
            let messageIndex = 0;
            let charIndex = 0;
            let isDeleting = false;
            let typingSpeed = 100; // Faster typing speed
            let deletingSpeed = 90; // Faster deleting speed
            let pauseBeforeDelete = 700; // Shorter pause
            let pauseBeforeType = 300; // Shorter pause
            
            function type() {
                const currentMessage = messages[messageIndex];
                
                if (isDeleting) {
                    // Deleting text
                    textElement.textContent = currentMessage.substring(0, charIndex - 1);
                    charIndex--;
                    typingSpeed = deletingSpeed;
                    
                    // When fully deleted
                    if (charIndex === 0) {
                        isDeleting = false;
                        messageIndex = (messageIndex + 1) % messages.length;
                        typingSpeed = pauseBeforeType;
                    }
                } else {
                    // Typing text
                    textElement.textContent = currentMessage.substring(0, charIndex + 1);
                    charIndex++;
                    
                    // When fully typed
                    if (charIndex === currentMessage.length) {
                        isDeleting = true;
                        typingSpeed = pauseBeforeDelete;
                    }
                }
                
                setTimeout(type, typingSpeed);
            }
            
            // Start the typing effect
            setTimeout(type, pauseBeforeType);
        });
    </script>
