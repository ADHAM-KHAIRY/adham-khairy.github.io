<script>
    /**
     * Fetches the Medium RSS feed.
     * Primary: AllOrigins (proxies the live feed, no server-side cache).
     * Fallback: rss2json (convenient, but its free tier serves stale cached feeds).
     */
    const MEDIUM_FEED_URL = 'https://0xsponge.medium.com/feed';
    const RSS2JSON_API    = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(MEDIUM_FEED_URL)}`;
    const ALLORIGINS_API  = `https://api.allorigins.win/get?url=${encodeURIComponent(MEDIUM_FEED_URL)}`;

    const grid = document.getElementById('blog-grid');

    const bust = () => `&_=${Date.now()}`;

    function stripHtml(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
    }

    function extractImage(html) {
        const match = String(html || '').match(/<img[^>]+src=["']([^"']+)["']/i);
        return match ? match[1] : null;
    }

    function cleanLink(url) {
        return String(url || '#').split('?')[0];
    }

    function formatDate(dateStr) {
        try {
            return new Date(dateStr).toLocaleDateString('en-US', {
                year: 'numeric', month: 'short', day: 'numeric'
            });
        } catch {
            return dateStr;
        }
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function renderPosts(posts) {
        if (!posts || posts.length === 0) {
            showError('No posts found. Check back later!');
            return;
        }

        grid.innerHTML = '';

        posts.forEach(post => {
            const title       = escapeHtml(post.title || 'Untitled');
            const link        = cleanLink(post.link || post.url);
            const pubDate     = formatDate(post.pubDate || post.published);
            const rawContent  = post.content || post.description || '';
            const description = escapeHtml(stripHtml(rawContent).slice(0, 200).trim()) + '…';
            const thumbnail   = post.thumbnail || extractImage(rawContent) || null;
            const tags        = (post.categories || []).slice(0, 3);

            const card = document.createElement('a');
            card.href      = link;
            card.target    = '_blank';
            card.rel       = 'noopener noreferrer';
            card.className = 'blog-link';

            card.innerHTML = `
                <div class="blog-card">
                    ${thumbnail ? `<img class="blog-card-thumbnail" src="${escapeHtml(thumbnail)}" alt="${title}" loading="lazy" onerror="this.style.display='none'">` : ''}
                    <h3 class="blog-title">${title}</h3>
                    <p class="blog-description">${description}</p>
                    <div class="blog-meta">
                        <span class="blog-date">${pubDate}</span>
                        ${tags.length ? `<div class="blog-tags">${tags.map(t => `<span class="blog-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
                    </div>
                </div>
            `;

            grid.appendChild(card);
        });
    }

    function showError(msg, detail) {
        grid.innerHTML = `
            <div class="error-state">
                <div>[!] ${escapeHtml(msg)}</div>
                ${detail ? `<code>${escapeHtml(detail)}</code>` : ''}
                <div style="margin-top:12px; font-size:0.85rem;">
                    View posts directly on
                    <a href="https://0xsponge.medium.com" target="_blank" rel="noopener">Medium →</a>
                </div>
            </div>`;
    }

    async function fetchViaAllOrigins() {
        const res  = await fetch(ALLORIGINS_API + bust(), { cache: 'no-store' });
        const data = await res.json();
        if (!data || !data.contents) throw new Error('allorigins returned no content');

        const xml = new DOMParser().parseFromString(data.contents, 'text/xml');
        if (xml.querySelector('parsererror')) throw new Error('feed XML parse error');

        const items = [...xml.querySelectorAll('item')];
        if (!items.length) throw new Error('no items in feed');

        return items.map(item => {
            const body = item.getElementsByTagName('content:encoded')[0]?.textContent
                      || item.querySelector('description')?.textContent
                      || '';
            return {
                title     : item.querySelector('title')?.textContent,
                link      : item.querySelector('link')?.textContent
                             || item.querySelector('guid')?.textContent,
                pubDate   : item.querySelector('pubDate')?.textContent,
                content   : body,
                thumbnail : extractImage(body),
                categories: [...item.querySelectorAll('category')].map(c => c.textContent)
            };
        });
    }

    async function fetchViaRss2Json() {
        const res  = await fetch(RSS2JSON_API + '&count=12' + bust(), { cache: 'no-store' });
        const data = await res.json();
        if (data.status !== 'ok') throw new Error(data.message || 'rss2json error');
        return data.items;
    }

    (async () => {
        try {
            renderPosts(await fetchViaAllOrigins());
        } catch (err1) {
            console.warn('allorigins failed, trying rss2json…', err1);
            try {
                renderPosts(await fetchViaRss2Json());
            } catch (err2) {
                console.error('Both proxies failed', err2);
                showError('Unable to load posts automatically.', err2.message);
            }
        }
    })();
</script>
