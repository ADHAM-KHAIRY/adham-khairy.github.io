<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xSponge</title>
    <style>
        :root {
            --bg-primary: #13151a;
            --bg-secondary: rgba(19, 21, 26, 0.8);
            --text-primary: #c9cadf;
            --text-secondary: #7a7c89;
            --accent: #6bd1ff;
            --border: #272a33;
            --header: #1d202a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }
        
        header {
            background-color: var(--header);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1rem;
            padding: 5px 10px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover, .nav-link.active {
            color: var(--accent);
            background-color: rgba(100, 255, 218, 0.1);
        }
        
        .container {
            flex: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .terminal-header {
            background-color: var(--header);
            color: var(--text-primary);
            padding: 8px 12px;
            font-weight: bold;
            text-align: left;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .section-title {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        
        .blog-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        
        .blog-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 5px 15px rgba(107, 209, 255, 0.2);
        }

        .blog-card-thumbnail {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }
        
        .blog-title {
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: bold;
            line-height: 1.4;
        }
        
        .blog-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 15px;
            flex-grow: 1;
            line-height: 1.5;
            /* Clamp to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .blog-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .blog-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .blog-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .blog-tag {
            background-color: rgba(107, 209, 255, 0.08);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            border: 1px solid rgba(107, 209, 255, 0.2);
        }
        
        .blog-link {
            text-decoration: none;
            color: inherit;
        }

        /* Loading & error states */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.9rem;
        }

        .loading-text .cursor-blink {
            display: inline-block;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .error-state {
            background-color: rgba(255, 100, 100, 0.05);
            border: 1px solid rgba(255, 100, 100, 0.2);
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            color: #ff8080;
            margin-top: 30px;
        }

        .error-state code {
            display: block;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Skeleton loader cards */
        .skeleton-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
        }

        .skeleton-thumb {
            width: 100%;
            height: 160px;
            background: linear-gradient(90deg, var(--border) 25%, #2e3140 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, var(--border) 25%, #2e3140 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 3px;
            margin-bottom: 10px;
        }

        .skeleton-line.short { width: 60%; }
        .skeleton-line.medium { width: 80%; }
        .skeleton-line.full { width: 100%; }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .read-more {
            color: var(--accent);
            font-size: 0.8rem;
            margin-top: 8px;
            opacity: 0.7;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background-color: var(--header);
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            margin-top: 40px;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .social-icon {
            color: var(--text-secondary);
            font-size: 1.2rem;
            transition: color 0.3s ease;
            text-decoration: none;
        }
        
        .social-icon:hover {
            color: var(--accent);
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-links {
                width: 100%;
                justify-content: space-around;
            }
            
            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="blog.html" class="nav-link active">Blog</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </nav>
    </header>
    
    <div class="container">
        <div class="terminal-header">
            root@kali:~$ curl -s https://0xsponge.medium.com/feed | parse_rss
        </div>
        
        <h2 class="section-title">CTF Writeups & Security Research</h2>

        <!-- Skeleton loaders shown while fetching -->
        <div class="blog-grid" id="blog-grid">
            <div class="skeleton-card">
                <div class="skeleton-thumb"></div>
                <div class="skeleton-line full"></div>
                <div class="skeleton-line medium"></div>
                <div class="skeleton-line short"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-thumb"></div>
                <div class="skeleton-line full"></div>
                <div class="skeleton-line medium"></div>
                <div class="skeleton-line short"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-thumb"></div>
                <div class="skeleton-line full"></div>
                <div class="skeleton-line medium"></div>
                <div class="skeleton-line short"></div>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <div class="social-icons">
            <a href="https://www.linkedin.com/in/adham-khairy-985834323/" class="social-icon" target="_blank">LinkedIn</a>
            <a href="https://tryhackme.com/p/0xAdham" class="social-icon" target="_blank">TryHackMe</a>
            <a href="https://hackerone.com/0xadham?type=user" class="social-icon" target="_blank">HackerOne</a>
        </div>
        <p style="margin-top: 10px;">© 2025 Adham Khairy (0xSponge) | All rights reserved</p>
    </footer>

    <script>
        /**
         * Fetches Medium RSS feed via rss2json API (no CORS issues, free tier).
         * Falls back to a second proxy if the first fails.
         */
        const MEDIUM_FEED_URL = 'https://0xsponge.medium.com/feed';
        const RSS2JSON_API    = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(MEDIUM_FEED_URL)}`;
        // Secondary proxy using allorigins (returns raw XML which we parse manually)
        const ALLORIGINS_API  = `https://api.allorigins.win/get?url=${encodeURIComponent(MEDIUM_FEED_URL)}`;

        const grid = document.getElementById('blog-grid');

        // ── Helper: strip HTML tags and return plain text excerpt ──────────────
        function stripHtml(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        // ── Helper: extract first <img> src from HTML string ───────────────────
        function extractImage(html) {
            const match = html.match(/<img[^>]+src=["']([^"']+)["']/i);
            return match ? match[1] : null;
        }

        // ── Helper: format ISO date to "Mon DD, YYYY" ─────────────────────────
        function formatDate(dateStr) {
            try {
                return new Date(dateStr).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
            } catch {
                return dateStr;
            }
        }

        // ── Render posts to the grid ───────────────────────────────────────────
        function renderPosts(posts) {
            if (!posts || posts.length === 0) {
                showError('No posts found. Check back later!');
                return;
            }

            grid.innerHTML = '';

            posts.forEach(post => {
                const title       = post.title || 'Untitled';
                const link        = post.link || post.url || '#';
                const pubDate     = formatDate(post.pubDate || post.published);
                const rawContent  = post.content || post.description || '';
                const description = stripHtml(rawContent).slice(0, 200).trim() + '…';
                const thumbnail   = post.thumbnail
                                    || extractImage(rawContent)
                                    || null;
                const tags        = (post.categories || []).slice(0, 3);

                const card = document.createElement('a');
                card.href   = link;
                card.target = '_blank';
                card.rel    = 'noopener noreferrer';
                card.className = 'blog-link';

                card.innerHTML = `
                    <div class="blog-card">
                        ${thumbnail ? `<img class="blog-card-thumbnail" src="${thumbnail}" alt="${title}" loading="lazy" onerror="this.style.display='none'">` : ''}
                        <h3 class="blog-title">${title}</h3>
                        <p class="blog-description">${description}</p>
                        <div class="blog-meta">
                            <span class="blog-date">${pubDate}</span>
                            ${tags.length ? `<div class="blog-tags">${tags.map(t => `<span class="blog-tag">${t}</span>`).join('')}</div>` : ''}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // ── Show error state ───────────────────────────────────────────────────
        function showError(msg, detail) {
            grid.innerHTML = `
                <div class="error-state" style="grid-column: 1/-1;">
                    <div>[!] ${msg}</div>
                    ${detail ? `<code>${detail}</code>` : ''}
                    <div style="margin-top:12px; font-size:0.85rem;">
                        View posts directly on 
                        <a href="https://0xsponge.medium.com" target="_blank" 
                           style="color: var(--accent);">Medium →</a>
                    </div>
                </div>`;
        }

        // ── Primary fetch: rss2json ────────────────────────────────────────────
        async function fetchViaRss2Json() {
            const res  = await fetch(RSS2JSON_API);
            const data = await res.json();
            if (data.status !== 'ok') throw new Error(data.message || 'rss2json error');
            return data.items;
        }

        // ── Secondary fetch: allorigins (raw XML) ─────────────────────────────
        async function fetchViaAllOrigins() {
            const res  = await fetch(ALLORIGINS_API);
            const data = await res.json();
            const xml  = new DOMParser().parseFromString(data.contents, 'text/xml');
            const items = [...xml.querySelectorAll('item')];
            return items.map(item => ({
                title    : item.querySelector('title')?.textContent,
                link     : item.querySelector('link')?.textContent
                            || item.querySelector('guid')?.textContent,
                pubDate  : item.querySelector('pubDate')?.textContent,
                content  : item.querySelector('encoded')?.textContent
                            || item.querySelector('description')?.textContent,
                thumbnail: extractImage(
                    item.querySelector('encoded')?.textContent
                    || item.querySelector('description')?.textContent || ''
                ),
                categories: [...item.querySelectorAll('category')].map(c => c.textContent)
            }));
        }

        // ── Bootstrap ─────────────────────────────────────────────────────────
        (async () => {
            try {
                const posts = await fetchViaRss2Json();
                renderPosts(posts);
            } catch (err1) {
                console.warn('rss2json failed, trying allorigins…', err1);
                try {
                    const posts = await fetchViaAllOrigins();
                    renderPosts(posts);
                } catch (err2) {
                    console.error('Both proxies failed', err2);
                    showError('Unable to load posts automatically.', err2.message);
                }
            }
        })();
    </script>
</body>
</html>
