<body>
    <header class="site-header">

    <main>

        <section class="section">
            <div class="section-head"><span class="idx">//</span><h2>Writeups &amp; Research</h2></div>
            <p class="page-intro">CTF writeups and offensive security notes — full articles hosted here, mirrored from Medium.</p>

            <div class="blog-grid" id="blog-grid">

<script>
    /**
     * Posts are mirrored into posts/ at build time (scripts/build_blog.py, run
     * daily by CI), so this is a same-origin JSON read — no CORS proxies, no
     * waiting on Medium. index.json is metadata only; each card links to the
     * full writeup hosted here.
     */
    const grid = document.getElementById('blog-grid');

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function renderPosts(posts) {
        if (!posts.length) {
            showError('No posts yet. Check back later!');
            return;
        }

        grid.innerHTML = posts.map(post => `
            <a class="blog-link" href="${escapeHtml(post.url)}">
                <div class="blog-card">
                    ${post.thumbnail ? `<img class="blog-card-thumbnail" src="${escapeHtml(post.thumbnail)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
                    <h3 class="blog-title">${escapeHtml(post.title)}</h3>
                    <p class="blog-description">${escapeHtml(post.excerpt)}</p>
                    <div class="blog-meta">
                        <span class="blog-date">${escapeHtml(post.date_label)} · ${post.minutes} min</span>
                        ${post.tags.length ? `<div class="blog-tags">${post.tags.map(t => `<span class="blog-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
                    </div>
                </div>
            </a>`).join('');
    }

    function showError(msg, detail) {
        grid.innerHTML = `
            <div class="error-state">
                <div>[!] ${escapeHtml(msg)}</div>
                ${detail ? `<code>${escapeHtml(detail)}</code>` : ''}
                <div style="margin-top:12px; font-size:0.85rem;">
                    View posts directly on
                    <a href="https://0xsponge.medium.com" target="_blank" rel="noopener">Medium →</a>
                </div>
            </div>`;
    }

    fetch('posts/index.json', { cache: 'no-cache' })
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(renderPosts)
        .catch(err => showError('Unable to load the post index.', err.message));
</script>
    <script src="app.js"></script>
</body>
</html>
